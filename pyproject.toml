[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "climate-risk"
description = "Climate disaster frequency and damage modeling for climate adaptation policy"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["version"]
authors = [
    { name = "Camilo Saldarriaga" },
    { name = "Jesse Grabowski" },
    { name = "Andrew Walters" },
]
keywords = ["climate", "bayesian", "disaster risk", "damage functions", "pymc"]
dependencies = [
    "numpy>=2.4,<3",
    "scipy>=1.18,<2",
    "pandas>=3.0,<4",
    "xarray>=2026.7,<2027",
    "h5netcdf>=1.6,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "fastexcel>=0.20,<1",
    "kuznets[polars]>=1.1.0,<2",
    "geopandas>=1.1,<2",
    "exactextract>=0.3,<1",
    "rasterio>=1.5,<2",
    "pymc>=6.3,<7",
    "pytensor>=3.3,<4",
    "arviz>=1.2,<2",
    "nutpie>=0.16,<1",
    "pymc-extras>=0.14.0,<1",
    "ptgp>=0.1.2,<1",
    "preliz>=0.27.1,<1",
    "scikit-learn>=1.9,<2",
    "statsmodels>=0.14,<1",
    "matplotlib>=3.11,<4",
    "seaborn>=0.13,<1",
    "tqdm>=4.70,<5",
    "anyascii>=0.3.3,<1",
    "requests>=2.34,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pre-commit>=4.6,<5",
    "mypy>=2.3,<3",
    "ruff>=0.16,<1",
    "pandas-stubs>=3.0.5,<4",
    "types-geopandas>=1.1.4,<2",
    "types-shapely>=2.1,<3",
    "types-tqdm>=4.70,<5",
    "scipy-stubs>=1.18.0.1,<2",
    "types-seaborn>=0.13.2.20240417,<1",
    "types-requests>=2.33,<3",
]
notebooks = ["notebook>=7.6,<8", "ipywidgets>=8.1,<9", "openai>=2.0", "nbclassic>=1.3.3,<2", "nbclassic-mcp-bridge>=1.1.0,<2", "gEconpy>=2.2,<3"]

[project.scripts]
install-climate-risk-skills = "climate_risk.skills.cli:main"

[project.urls]
Repository = "https://github.com/jessegrabowski/climate-risk"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "climate_risk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["climate_risk"]

[tool.hatch.build.targets.wheel.force-include]
"docs/source/user_guide" = "climate_risk/docs"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/notebooks", "/methodological_paper", "/Papers", "/data"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# geopandas needs GDAL, GEOS and PROJ built against a common ABI.
[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.4,<3"
scipy = ">=1.18,<2"
pandas = ">=3.0,<4"
xarray = ">=2026.7,<2027"
h5netcdf = ">=1.6,<2"
openpyxl = ">=3.1,<4"
xlrd = ">=2.0,<3"
geopandas = ">=1.1,<2"
exactextract = ">=0.3,<1"
rasterio = ">=1.5,<2"
pymc = ">=6.3,<7"
pytensor = ">=3.3,<4"
arviz = ">=1.2,<2"
nutpie = ">=0.16,<1"
preliz = ">=0.27.1,<1"
scikit-learn = ">=1.9,<2"
statsmodels = ">=0.14,<1"
matplotlib = ">=3.11,<4"
seaborn = ">=0.13,<1"
tqdm = ">=4.70,<5"
anyascii = ">=0.3.3,<1"
requests = ">=2.34.2,<3"
polars = ">=1.43,<2"
pyarrow = ">=25.0,<26"
fastexcel = ">=0.20,<1"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.16,<1"
pytest = ">=9.1,<10"
pytest-cov = ">=7.1,<8"
pre-commit = ">=4.6,<5"
mypy = ">=2.3,<3"
pandas-stubs = ">=3.0.5.260730,<4"
types-tqdm = ">=4.70.0.20260731,<5"
types-geopandas = ">=1.1.4.20260728,<2"
types-shapely = ">=2.1,<3"
types-requests = ">=2.33.0.20260712,<3"
scipy-stubs = ">=1.18.0.1,<2"
types-seaborn = ">=0.13.2.20240417,<1"

[tool.pixi.feature.notebooks.dependencies]
notebook = ">=7.6,<8"
ipywidgets = ">=8.1,<9"
nbclassic = ">=1.3.3,<2"

# nbclassic-mcp-bridge is not on conda-forge. gEconpy is, but its conda build depends on
# pymc-extras, which would put that back in the conda solve and re-impose its caps.
[tool.pixi.feature.notebooks.pypi-dependencies]
nbclassic-mcp-bridge = ">=1.1.0,<2"
geconpy = ">=2.2,<3"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=9.1,<10"
pydata-sphinx-theme = ">=0.21,<1"
myst-nb = ">=1.4,<2"
numpydoc = ">=1.10,<2"
sphinx-copybutton = ">=0.5.2,<1"
sphinx-design = ">=0.7,<1"
sphinx-codeautolink = ">=0.19,<1"
sphinx-sitemap = ">=2.9,<3"
sphinx-notfound-page = ">=1.1,<2"
sphinx-autobuild = ">=2025.8"
ipython = ">=9.16,<10"

[tool.pixi.feature.docs.tasks]
docs-build = { cmd = "sphinx-build -b html source build/html", cwd = "docs" }
# Autosummary writes its stubs back into source/, which would otherwise retrigger the watcher and
# rebuild forever. The ignored paths are the same set docs/.gitignore lists.
docs-serve = { cmd = """\
    sphinx-autobuild source build/html --port 8000 --open-browser \
    --ignore '*/source/api/generated/*'\
""", cwd = "docs" }

# pymc-extras caps pytensor and pymc at the minor it was built against. The caps are
# defensive, so it is resolved from PyPI where the overrides below can relax them.
[tool.pixi.pypi-options]
dependency-overrides = { pytensor = ">=3.3,<4", pymc = ">=6.3,<7" }

[tool.pixi.pypi-dependencies]
climate-risk = { path = ".", editable = true }
pymc-extras = ">=0.14.0,<1"
ptgp = ">=0.1.2,<1"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
notebooks = { features = ["dev", "notebooks"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
test-network = "pytest --run-network -m network"
lint = "ruff check . && ruff format --check ."
typecheck = "mypy"
fmt = "ruff format ."
verify-placement = "python tools/verify_placement_against_emdat.py"
verify-geocoder = "python tools/verify_geocoder_against_gadm.py"
fetch-geonames = "python tools/fetch_geonames.py"
check-corrections = "python tools/verify_name_corrections.py check"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
xfail_strict = true
addopts = ["-ra", "--strict-markers"]
markers = [
    "network: hits the real network; deselected by default, run nightly",
    "slow: PyMC sampling or other multi-second work",
    "requires_emdat: needs the licensed EM-DAT workbook, absent from CI",
    "requires_gadm: needs the GADM GeoPackage, which is non-commercial and absent from CI",
    "requires_geo_disasters: needs the Geo-Disasters GeoPackage, non-commercial and absent from CI",
    "requires_ghsl: needs the GHS-POP raster, half a gigabyte and absent from CI",
]
filterwarnings = [
    "error",
    # ESRI Shapefile truncates column names to 10 characters, and load_grid_point_data renames them
    # back when it reads the file.
    "ignore:Column names longer than 10 characters:UserWarning",
    "ignore:Normalized/laundered field name:RuntimeWarning",
    # A shapefile Date field holds whole days, so a timestamp column is written as text.
    "ignore:Field .* created as String field:RuntimeWarning",
    # numba colorizes the message, so the pattern cannot anchor at the start.
    'ignore:.*np\.dot\(\) is faster on contiguous arrays:numba.core.errors.NumbaPerformanceWarning',
]

[tool.mypy]
# An include list that only grows. A package joins it when it is typed, and never leaves. A module
# absent from this list is unchecked, so check the ones that are missing before assuming they fail.
files = [
    "climate_risk/__init__.py",
    "climate_risk/_version.py",
    "climate_risk/config",
    "climate_risk/data",
    "climate_risk/data_functions/__init__.py",
    "climate_risk/data_functions/combine_data.py",
    "climate_risk/data_functions/emdat_processing.py",
    "climate_risk/data_functions/rivers_damage.py",
    "climate_risk/data_functions/rivers_data_loader.py",
    "climate_risk/data_functions/shapefiles_data_loader.py",
    "climate_risk/dsge",
    "climate_risk/exceptions.py",
    "climate_risk/geo",
    "climate_risk/models",
    "climate_risk/plotting.py",
    "climate_risk/replication_data.py",
    "climate_risk/sample.py",
    "climate_risk/skills",
    "climate_risk/stats",
    "tests",
    "tools",
]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
strict_equality = true

# A name bound on only some paths reads as defined and raises at runtime. Off by default in mypy.
enable_error_code = ["possibly-undefined"]

# No stubs exist for these, on the index or in the packages themselves.
[[tool.mypy.overrides]]
module = ["arviz.*", "pymc.*", "pytensor.*", "ptgp.*", "exactextract.*", "rasterio.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true

# Test functions carry no annotations, so their bodies need checking on their own terms.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "methodological_paper"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "W", "RUF"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D200",
    "D202",
    "D203",
    "D204",
    "D205",
    "D209",
    "D212",
    "D213",
    "D301",
    "D400",
    "D401",
    "D403",
    "D413",
    "D415",
    "D417",
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.isort]
lines-between-types = 1
known-first-party = ["climate_risk"]
