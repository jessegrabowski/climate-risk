name: Read the Docs PR preview

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    # Only fire when something that could change the rendered docs is touched. climate_risk is
    # here because autodoc reads it.
    paths:
      - "docs/**"
      - "climate_risk/**"
      - ".readthedocs.yaml"
      - "pyproject.toml"
      - "pixi.lock"

# Cancels previous runs for a pull request that has not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  documentation-links:
    name: Post preview link
    runs-on: ubuntu-latest
    steps:
      - uses: readthedocs/actions/preview@b8bba1484329bda1a3abe986df7ebc80a8950333 # v1.5
        with:
          project-slug: "climate-risk"
