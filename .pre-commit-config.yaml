repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: no-commit-to-branch
        args: [--branch, main]
    -   id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.1
  hooks:
    - id: ruff-check
      args: ["--fix", "--output-format=full"]
    - id: ruff-format
- repo: https://github.com/MarcoGorelli/madforhooks
  rev: 0.4.1
  hooks:
    - id: no-print-statements
      exclude: '^(climate_risk/skills/cli\.py|climate_risk/stats/timeseries\.py|tools/)'
    - id: check-execution-order
      # The geo damage notebooks are fitting experiments, worked cell by cell against a live
      # kernel, so their execution counts are never monotone.
      exclude: ^notebooks/geo_damage_model/
- repo: local
  hooks:
    - id: no-relative-imports
      name: No relative imports
      entry: from \.[\.\w]* import
      types: [python]
      language: pygrep
    - id: pixi-lock-check
      name: pixi.lock is in sync with pyproject.toml
      entry: pixi lock --check
      language: system
      files: ^(pyproject\.toml|pixi\.lock)$
      pass_filenames: false
